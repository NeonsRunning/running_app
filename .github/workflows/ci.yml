name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # PageProps and LayoutProps are generated into .next/types; a fresh
      # checkout has none until this runs.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run check:i18n
      - run: npm test
      # No Supabase, Stripe or Brevo variables: the app builds signed out,
      # with payments and email reporting themselves unavailable.
      - run: npm run build
      # Critical only for now: a transitive high-severity advisory
      # (source-map-js) is waiting on `npm audit fix`.
      - run: npm audit --omit=dev --audit-level=critical

  database:
    name: Migrations and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.104.0
      # Applies every migration to a fresh local Postgres, so a migration that
      # does not apply fails here, not in production.
      - run: supabase db start
      # pgTAP tests in supabase/tests: row-level security and the SQL
      # functions behind registrations, payments and events.
      - run: supabase test db
