name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, not a tag: a tag can be moved to different
# code, and these jobs run with the repository's token. The comment beside
# each is the version that commit is.
jobs:
  app:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The migration check compares against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # PageProps and LayoutProps are generated into .next/types; a fresh
      # checkout has none until this runs.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run check:i18n
      # Migration names, and on a pull request that none was added before
      # the newest one already on the base branch.
      - run: npm run check:migrations -- ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - run: npm test
      # No Supabase, Stripe or Brevo variables: the app builds signed out,
      # with payments and email reporting themselves unavailable.
      - run: npm run build
      # Runtime dependencies only; dev tooling never ships.
      - run: npm audit --omit=dev --audit-level=high

  database:
    name: Migrations and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.104.0
      # Applies every migration to a fresh local Postgres, so a migration that
      # does not apply fails here, not in production.
      - run: supabase db start
      # pgTAP tests in supabase/tests: row-level security and the SQL
      # functions behind registrations, payments and events.
      - run: supabase test db
